name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # Runs prepublishOnly (pnpm test:pipeline: lint + typecheck + test + build + smoke).
      # Idempotent: a re-run after a partial failure (e.g. only the GitHub
      # Packages leg failed) must not die on "cannot republish a version".
      - name: Publish to npmjs
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version --registry=https://registry.npmjs.org 2>/dev/null | grep -q .; then
            echo "$PKG@$VER is already on npmjs — skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages leg: a second setup-node pass rewrites
      # NPM_CONFIG_USERCONFIG with the pkg.github.com registry + auth line —
      # the documented two-registry pattern. Hand-appending to ~/.npmrc is
      # silently ignored because npm only reads NPM_CONFIG_USERCONFIG, and
      # appending to that file is brittle (no guaranteed trailing newline).
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        run: |
          # --ignore-scripts skips prepublishOnly, so when the npmjs leg was
          # skipped (version already published) nothing has built dist/ yet.
          if [ ! -f dist/main.js ]; then
            pnpm build
          fi
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version 2>/dev/null | grep -q .; then
            echo "$PKG@$VER is already on GitHub Packages — skipping"
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
