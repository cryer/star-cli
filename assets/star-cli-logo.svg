<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Star CLI animated logo">
  <style>
    .tw { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity:.12 } 50% { opacity:.95 } }
    .typed { clip-path: inset(0 100% 0 0); animation: type 1.9s steps(19) 2.1s forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .cursor { opacity: 0; animation: blink 1s steps(1) 4.1s infinite; }
    @keyframes blink { 0% { opacity:1 } 50% { opacity:0 } }
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
  </style>

  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="85%">
      <stop offset="0%" stop-color="#0d1330"/>
      <stop offset="55%" stop-color="#070b1d"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="starFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0%;-70%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;30%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1e293b"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbitPath" d="M 275 205 A 205 82 0 1 1 685 205 A 205 82 0 1 1 275 205" fill="none"/>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="560" fill="url(#bg)"/>
  <rect width="960" height="560" fill="url(#dots)" opacity=".55"/>

  <!-- 扫描线 -->
  <rect x="0" y="0" width="960" height="70" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 -80" to="0 640" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- 闪烁星尘 -->
  <g>
    <circle class="tw" cx="605" cy="34" r="1.3" fill="#7dd3fc" style="animation-duration:2.7s;animation-delay:-2.9s"/>
    <circle class="tw" cx="561" cy="36" r="1.0" fill="#a78bfa" style="animation-duration:2.8s;animation-delay:-2.4s"/>
    <circle class="tw" cx="674" cy="270" r="1.5" fill="#7dd3fc" style="animation-duration:3.3s;animation-delay:-1.1s"/>
    <circle class="tw" cx="713" cy="81" r="1.5" fill="#f9fafb" style="animation-duration:2.9s;animation-delay:-0.9s"/>
    <circle class="tw" cx="122" cy="158" r="1.4" fill="#7dd3fc" style="animation-duration:3.0s;animation-delay:-1.1s"/>
    <circle class="tw" cx="687" cy="213" r="2.3" fill="#f9fafb" style="animation-duration:3.1s;animation-delay:-2.2s"/>
    <circle class="tw" cx="550" cy="272" r="1.0" fill="#7dd3fc" style="animation-duration:2.7s;animation-delay:-1.2s"/>
    <circle class="tw" cx="800" cy="328" r="1.4" fill="#a78bfa" style="animation-duration:3.3s;animation-delay:-3.3s"/>
    <circle class="tw" cx="363" cy="98" r="1.3" fill="#a78bfa" style="animation-duration:4.4s;animation-delay:-2.6s"/>
    <circle class="tw" cx="511" cy="111" r="1.5" fill="#a78bfa" style="animation-duration:2.8s;animation-delay:-3.7s"/>
    <circle class="tw" cx="646" cy="320" r="2.0" fill="#f9fafb" style="animation-duration:2.7s;animation-delay:-0.1s"/>
    <circle class="tw" cx="391" cy="48" r="2.2" fill="#a78bfa" style="animation-duration:3.6s;animation-delay:-2.9s"/>
    <circle class="tw" cx="620" cy="163" r="2.2" fill="#a78bfa" style="animation-duration:3.3s;animation-delay:-1.1s"/>
    <circle class="tw" cx="700" cy="214" r="1.9" fill="#f9fafb" style="animation-duration:3.2s;animation-delay:-2.3s"/>
    <circle class="tw" cx="227" cy="374" r="1.6" fill="#7dd3fc" style="animation-duration:2.4s;animation-delay:-0.2s"/>
    <circle class="tw" cx="168" cy="81" r="1.9" fill="#67e8f9" style="animation-duration:3.6s;animation-delay:-1.5s"/>
  </g>

  <!-- HUD 四角框 -->
  <g stroke="#3b82f6" stroke-width="2" opacity=".35" fill="none">
    <path d="M28 52 V28 H52"/><path d="M908 28 H932 V52"/>
    <path d="M28 508 V532 H52"/><path d="M932 508 V532 H908"/>
  </g>

  <!-- 星后光晕 -->
  <circle cx="480" cy="205" r="165" fill="url(#halo)">
    <animate attributeName="opacity" values=".55;.95;.55" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 轨道环 -->
  <ellipse cx="480" cy="205" rx="205" ry="82" fill="none" stroke="#6366f1"
           stroke-width="1.2" stroke-dasharray="3 9" opacity=".45">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 轨道粒子 -->
  <g filter="url(#glowSoft)">
    <circle r="4" fill="#67e8f9">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#orbitPath" href="#orbitPath"/></animateMotion>
    </circle>
    <circle r="3" fill="#a78bfa">
      <animateMotion dur="10s" begin="-4s" repeatCount="indefinite"><mpath xlink:href="#orbitPath" href="#orbitPath"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#f472b6">
      <animateMotion dur="13s" begin="-8s" repeatCount="indefinite"><mpath xlink:href="#orbitPath" href="#orbitPath"/></animateMotion>
    </circle>
  </g>

  <!-- 漂浮代码符号 -->
  <g fill="#818cf8" font-size="26" font-weight="700" opacity=".28" text-anchor="middle">
    <text x="150" y="125">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="795" y="140">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6.5s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="205" y="330">*<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5.6s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="760" y="325">$_<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" begin="-3s" repeatCount="indefinite"/></text>
  </g>

  <!-- 主星：描边绘制 + 填充淡入 + 缓慢自转 -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 480 205" to="360 480 205" dur="90s" repeatCount="indefinite"/>
      <path d="M480.0,95.0 L505.9,169.4 L584.6,171.0 L521.8,218.6 L544.7,294.0 L480.0,249.0 L415.3,294.0 L438.2,218.6 L375.4,171.0 L454.1,169.4 Z" fill="url(#starFill)" fill-opacity="0"
            stroke="url(#starGrad)" stroke-width="3.5" stroke-linejoin="round"
            pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" fill="freeze"
                 calcMode="spline" keySplines="0.4 0 0.2 1"/>
        <animate attributeName="fill-opacity" from="0" to="1" begin="1.1s" dur="1.1s" fill="freeze"/>
      </path>
    </g>
  </g>

  <!-- 星心闪光 -->
  <g transform="translate(480 205)">
    <path d="M0 -30 L4.5 -4.5 L30 0 L4.5 4.5 L0 30 L-4.5 4.5 L-30 0 L-4.5 -4.5 Z"
          fill="#e0f2fe" filter="url(#glowSoft)">
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;1;.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 标题 -->
  <text x="480" y="408" text-anchor="middle" font-size="62" font-weight="800"
        letter-spacing="12" fill="url(#textGrad)" filter="url(#glow)">STAR CLI</text>
  <text x="480" y="448" text-anchor="middle" font-size="15" letter-spacing="7"
        fill="#8b9cc9" opacity=".85">// CODING AGENT</text>

  <!-- 打字命令行 -->
  <text class="typed" x="480" y="492" text-anchor="middle" font-size="20" fill="#67e8f9">$ star init --agent</text>
  <rect class="cursor" x="602" y="473" width="11" height="23" fill="#67e8f9"/>

  <text x="930" y="536" text-anchor="end" font-size="12" fill="#475569">v1.0.0</text>
</svg>